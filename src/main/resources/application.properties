spring.application.name=microservico-usuarios
server.port=8082

# URL de Conexão
spring.datasource.url=${AZURE_SQL_URL}

# Credenciais
spring.datasource.username=${AZURE_SQL_USER}
spring.datasource.password=${AZURE_SQL_PASSWORD}

# Configurações do Hibernate (A mágica que cria as tabelas)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html